<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TMLDRNR — PoC</title>
    <link rel="stylesheet" href="./style.css">
    <script type="module" src="./src/main.js"></script>
  </head>
  <body>
    <main class="shell">
      <header>
        <h1>TMLDRNR</h1>
        <p>PoC 開発基盤 · サンプル盤面と入力確認</p>
      </header>

      <section aria-labelledby="board-heading">
        <h2 id="board-heading">サンプル盤面</h2>
        <div id="board" class="board" role="img" aria-label="サンプル盤面"></div>
        <p class="legend">● Player　◆ Guard　▣ ゴール　▤ 梯子　━ ロープ　■ 壁・床</p>
      </section>

      <section aria-labelledby="input-heading">
        <h2 id="input-heading">Action 入力</h2>
        <div class="controls" aria-label="方向と待機">
          <button type="button" data-action="up" class="up">上 ↑</button>
          <button type="button" data-action="left" class="left">左 ←</button>
          <button type="button" data-action="wait" class="wait">待機</button>
          <button type="button" data-action="right" class="right">右 →</button>
          <button type="button" data-action="down" class="down">下 ↓</button>
        </div>
        <p class="hint">矢印キー / Space キーでも入力できます。盤面はまだ動きません。</p>
        <p class="diagnostic">最後の Action: <output id="last-action" aria-live="polite">なし</output></p>
      </section>
    </main>
  </body>
</html>
